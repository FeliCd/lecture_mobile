name: lecturer_companion
description: FAP Smart Lecturer Lab 2 with lecturer and student classroom workflows.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: 9.2.4
  qr_flutter: ^4.1.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
